name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, master, develop, "**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend (lint, types, tests, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -f backend/requirements-tests.txt ]; then pip install -r backend/requirements-tests.txt; fi
          # Ensure tools available even if not pinned
          pip install pytest pytest-cov ruff black mypy

      - name: Ruff (lint)
        run: ruff check backend/app

      - name: Black (format check)
        run: black --check backend/app

      - name: Mypy (type check)
        run: mypy backend/app --config-file=pyproject.toml

      - name: Start test stack (db + runner)
        run: docker compose -f docker-compose.test.yml up -d db runner

      - name: Wait for DB healthy
        run: |
          for i in {1..30}; do
            if docker compose -f docker-compose.test.yml exec -T db mariadb-admin \
              ping -h 127.0.0.1 --protocol=TCP -uroot -p"${MARIADB_ROOT_PASSWORD:-rootpass}" --silent; then
              echo "DB OK"; break; fi; echo "Waiting for DB..."; sleep 3; done

      - name: Pytest (inside runner) with 10% coverage
        run: |
          docker compose -f docker-compose.test.yml exec -T runner bash -lc \
            "pytest -q --cov=backend/app --cov-report=xml:backend-coverage.xml --cov-report=term-missing --cov-fail-under=10"

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-xml
          path: backend-coverage.xml

      - name: Teardown test stack
        if: ${{ always() }}
        run: docker compose -f docker-compose.test.yml down -v

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start test stack (db + runner)
        run: docker compose -f docker-compose.test.yml up -d db runner

      - name: Wait for DB healthy
        run: |
          for i in {1..30}; do
            if docker compose -f docker-compose.test.yml exec -T db mariadb-admin \
              ping -h 127.0.0.1 --protocol=TCP -uroot -p"${MARIADB_ROOT_PASSWORD:-rootpass}" --silent; then
              echo "DB OK"; break; fi; echo "Waiting for DB..."; sleep 3; done

      - name: Run integration tests
        run: |
          docker compose -f docker-compose.test.yml exec -T runner bash -lc \
            "pytest -q backend/tests/integration -v -m integration"

      - name: Teardown test stack
        if: ${{ always() }}
        run: docker compose -f docker-compose.test.yml down -v

  api-contract-tests:
    name: API Contract Tests
    runs-on: ubuntu-latest
    needs: [integration-tests]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start test stack (db + runner)
        run: docker compose -f docker-compose.test.yml up -d db runner

      - name: Wait for DB healthy
        run: |
          for i in {1..30}; do
            if docker compose -f docker-compose.test.yml exec -T db mariadb-admin \
              ping -h 127.0.0.1 --protocol=TCP -uroot -p"${MARIADB_ROOT_PASSWORD:-rootpass}" --silent; then
              echo "DB OK"; break; fi; echo "Waiting for DB..."; sleep 3; done

      - name: Run API contract tests
        run: |
          docker compose -f docker-compose.test.yml exec -T runner bash -lc \
            "pytest -q backend/tests/integration/test_api_contract.py -v --tb=short"

      - name: Teardown test stack
        if: ${{ always() }}
        run: docker compose -f docker-compose.test.yml down -v

  frontend:
    name: Frontend (lint, format, unit tests, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Disable npm update notifier in CI
        run: echo "NPM_CONFIG_UPDATE_NOTIFIER=false" >> $GITHUB_ENV

      - name: Install dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Prettier (check)
        working-directory: frontend
        run: npm run format:check

      - name: Run unit tests (Vitest) with coverage
        working-directory: frontend
        run: npm run test:unit:coverage

      - name: Enforce frontend coverage >= 10%
        if: ${{ always() }}
        working-directory: frontend
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            pct=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
            pct_int=$(printf '%.0f' "$pct")
            echo "Frontend coverage: ${pct}%"
            if [ "$pct_int" -lt 10 ]; then
              echo "Coverage below threshold (10%)." >&2
              exit 1
            fi
          else
            echo "No coverage summary generated; skipping coverage gate."
          fi

      - name: Upload frontend coverage artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage

  dep-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Run dependency audit
        run: make dep-audit-ci

  deploy-check:
    name: Backend Deployment Check
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Generate GitHub CI self-signed TLS certs
        run: |
          set -euo pipefail
          mkdir -p ssl
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout ssl/github-ci.privkey.pem \
            -out ssl/github-ci.fullchain.pem \
            -subj "/CN=aw.max" \
            -addext "subjectAltName=DNS:aw.max,DNS:localhost,IP:127.0.0.1"
      - name: Start db
        run: docker compose -f docker-compose.test.yml up -d db
        env:
          SSL_CERT_FILE: ./ssl/github-ci.fullchain.pem
          SSL_KEY_FILE: ./ssl/github-ci.privkey.pem
      - name: Wait for DB healthy
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if docker compose -f docker-compose.test.yml exec -T db mariadb-admin \
              ping -h 127.0.0.1 --protocol=TCP -uroot -p"${MARIADB_ROOT_PASSWORD:-rootpass}" --silent; then
              echo "DB OK"; break; fi; echo "Waiting for DB..."; sleep 3; done
      - name: Start backend + nginx
        run: docker compose -f docker-compose.test.yml up -d backend nginx
        env:
          SSL_CERT_FILE: ./ssl/github-ci.fullchain.pem
          SSL_KEY_FILE: ./ssl/github-ci.privkey.pem
      - name: Verify Backend Health
        run: |
          echo "Waiting for backend health..."
          for i in {1..30}; do
            if curl -sSf http://127.0.0.1:5080/api/health | grep -q '"ok"'; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend deployment check failed"
          docker compose -f docker-compose.test.yml logs backend
          exit 1
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  e2e:
    name: E2E (Playwright via docker-compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend, deploy-check]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate GitHub CI self-signed TLS certs
        run: |
          set -euo pipefail
          mkdir -p ssl
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout ssl/github-ci.privkey.pem \
            -out ssl/github-ci.fullchain.pem \
            -subj "/CN=aw.max" \
            -addext "subjectAltName=DNS:aw.max,DNS:localhost,IP:127.0.0.1"

      - name: Start db
        run: docker compose -f docker-compose.test.yml up -d db
        env:
          SSL_CERT_FILE: ./ssl/github-ci.fullchain.pem
          SSL_KEY_FILE: ./ssl/github-ci.privkey.pem
      - name: Wait for DB healthy
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if docker compose -f docker-compose.test.yml exec -T db mariadb-admin \
              ping -h 127.0.0.1 --protocol=TCP -uroot -p"${MARIADB_ROOT_PASSWORD:-rootpass}" --silent; then
              echo "DB OK"; break; fi; echo "Waiting for DB..."; sleep 3; done
      - name: Start backend + frontend + nginx + e2e
        run: docker compose -f docker-compose.test.yml up -d backend frontend nginx e2e
        env:
          SSL_CERT_FILE: ./ssl/github-ci.fullchain.pem
          SSL_KEY_FILE: ./ssl/github-ci.privkey.pem

      - name: Wait for services (backend + frontend)
        run: |
          set -euo pipefail
          echo "Waiting for backend health via nginx..."
          for i in {1..60}; do
            if curl -sSf http://127.0.0.1:5080/api/health | grep -q '"ok"'; then
              echo "Backend is up"
              break
            fi
            sleep 2
          done
          echo "Waiting for frontend root via nginx..."
          for i in {1..60}; do
            if curl -sSf http://127.0.0.1:5080/ >/dev/null; then
              echo "Frontend is up"
              break
            fi
            sleep 2
          done

      - name: Run Playwright tests (containerized)
        run: docker compose -f docker-compose.test.yml exec -T e2e npx playwright test --config ./playwright.config.ts
        env:
          E2E_BASE_URL: https://aw.max

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      - name: Run pre-commit
        run: |
          if [ -f .pre-commit-config.yaml ]; then
            SKIP=eslint,prettier pre-commit run --all-files --show-diff-on-failure --color always
          else
            echo "No .pre-commit-config.yaml; skipping."
          fi
