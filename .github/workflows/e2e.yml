name: E2E

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Generate GitHub CI self-signed TLS certs
        run: |
          set -euo pipefail
          mkdir -p ssl
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout ssl/github-ci.privkey.pem \
            -out ssl/github-ci.fullchain.pem \
            -subj "/CN=aw.max" \
            -addext "subjectAltName=DNS:aw.max,DNS:localhost,IP:127.0.0.1"

      - name: Start services (docker-compose)
        run: |
          docker compose -f docker-compose.test.yml up -d db backend frontend nginx e2e
        env:
          SSL_CERT_FILE: ./ssl/github-ci.fullchain.pem
          SSL_KEY_FILE: ./ssl/github-ci.privkey.pem

      - name: Wait for services (backend + frontend)
        run: |
          set -e
          echo "Waiting for backend health..."
          for i in {1..60}; do
            if curl -sSf http://127.0.0.1:5080/api/health | grep -q '"ok"'; then echo OK; break; fi; sleep 2; done
          echo "Waiting for frontend root..."
          for i in {1..60}; do
            if curl -sSf http://127.0.0.1:5080/ >/dev/null; then echo OK; break; fi; sleep 2; done

      - name: Run Playwright tests (containerized)
        run: |
          docker compose -f docker-compose.test.yml exec -T e2e npx playwright test --config playwright.config.ts
        env:
          E2E_BASE_URL: https://aw.max

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  storybook:
    name: Storybook Build & Test
    runs-on: ubuntu-latest
    needs: [e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Build Storybook
        run: make sb-build
      - name: Test Storybook
        run: make sb-test
